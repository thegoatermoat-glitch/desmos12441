services:
  - type: web
    name: desmos-testing
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_ORIGIN
        fromService:
          name: desmos-testing
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          name: desmos-testing
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: HOST
        value: 0.0.0.0
      - key: CONTENT_ORIGIN
        value: https://content.desmos.lol
      - key: BROWSER_SHORTCUTS
        value: '[{"id":"tiktok","name":"TikTok","url":"https://www.tiktok.com/"},{"id":"youtube","name":"YouTube","url":"https://www.youtube.com/"}]'
      - key: SERVE_FRONTEND
        value: 'true'
      - key: FRONTEND_BUILD_DIR
        value: /app/frontend/build
      - key: OPENROUTER_MODEL
        value: cognitivecomputations/dolphin-mistral-24b-venice-edition
      - key: OPENROUTER_REQUEST_BUDGET_USD
        value: '0.01'
      - key: OPENROUTER_MAX_OUTPUT_TOKENS
        value: '1024'
      - key: OPENROUTER_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: WISP_ENDPOINTS
        value: wss://wisp-proxy.emergent.host/api/wisp,wss://wisp-proxy.emergent.host/api/wisp2
      - key: GAME_RAW_BASE
        value: https://raw.githubusercontent.com/CoolDude2349/Offline-HTML-Games-Pack/master/offline/
      - key: GAME_SOURCE_URL
        value: https://github.com/CoolDude2349/Offline-HTML-Games-Pack/tree/master/offline
      - key: GAME_CACHE_DIR
        value: /tmp/library-cache
      - key: GAME_MAX_BYTES
        value: '100000000'
      - key: GAME_CACHE_MAX_BYTES
        value: '500000000'